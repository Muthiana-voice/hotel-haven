name: Auto-deploy to Render

# Every push to the working branch is merged into `main`, which is the
# branch the Render service watches. Render's auto-deploy then rebuilds
# and publishes the site automatically — no manual step needed.
on:
  push:
    branches:
      - feature/location-aware-hotel-discovery

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge working branch into main and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "origin/${GITHUB_REF_NAME}"
          git push origin main
